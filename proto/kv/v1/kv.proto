syntax = "proto3";

package kv.v1;

option go_package = "github.com/kaverii11/dist-key-value-store/gen/kv/v1;kvv1";

// KV is the client-facing API of one cluster node. Only the leader serves
// requests; any other node answers FAILED_PRECONDITION with the leader's
// gRPC address in the "x-leader-addr" response header, so clients can retry
// there.
service KV {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Status is served by every node (leader or not), so clients and load
  // tests can find the current leader.
  rpc Status(StatusRequest) returns (StatusResponse);
}

message PutRequest {
  string key = 1;
  string value = 2;
}
message PutResponse {}

message GetRequest {
  string key = 1;
}
message GetResponse {
  string value = 1;
}

message DeleteRequest {
  string key = 1;
}
message DeleteResponse {}

message StatusRequest {}
message StatusResponse {
  string id = 1;
  string state = 2;        // Follower, Candidate or Leader
  uint64 term = 3;
  string leader_id = 4;
  string leader_addr = 5;  // the leader's gRPC address, if known
  uint64 commit_index = 6;
  uint64 last_log_index = 7;
  int64 keys = 8;          // keys in this node's applied state
}
