# 3-node cluster + Prometheus + Grafana.
#   docker compose -f deploy/docker-compose.yml up -d --build
# Grafana: http://localhost:3001 (dashboard "KV cluster"), Prometheus: http://localhost:9090
name: kv
x-node: &node
  build: { context: .., dockerfile: Dockerfile }
  image: dist-kv:dev
  restart: "no"

services:
  node1:
    <<: *node
    container_name: kv-node1
    command: ["-id", "node1"]
    ports: ["9001:9001", "2112:2112"]
    volumes: ["node1-data:/data"]
  node2:
    <<: *node
    container_name: kv-node2
    command: ["-id", "node2"]
    ports: ["9002:9002", "2113:2112"]
    volumes: ["node2-data:/data"]
  node3:
    <<: *node
    container_name: kv-node3
    command: ["-id", "node3"]
    ports: ["9003:9003", "2114:2112"]
    volumes: ["node3-data:/data"]

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: kv-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.0.2
    container_name: kv-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]

volumes:
  node1-data:
  node2-data:
  node3-data:
