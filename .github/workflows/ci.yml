name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit tests (race detector)
        run: go test -race -count=1 ./...

  chaos:
    # Starts the 3-node cluster in Docker, kills the leader under load,
    # restarts it, and fails if any acknowledged write is lost or the
    # nodes don't converge.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start cluster
        run: docker compose -f deploy/docker-compose.yml up -d --build node1 node2 node3
      - name: wait for a leader
        run: |
          for i in $(seq 1 30); do
            for p in 2112 2113 2114; do
              curl -s localhost:$p/metrics | grep -q '^kv_raft_is_leader 1' && exit 0
            done
            sleep 1
          done
          exit 1
      - name: kill the leader under load
        run: ./scripts/chaos.sh
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color | grep -v appended | tail -200
